---
# Dedicated AntiBlock / Yandex Cloud CDN orchestration.
# Remnawave Hosts are out of scope (stage 6).
#
# Order: shared inbound + squads on panel, then on each CDN-enabled VPN node
# (group antiblock_cdn_nodes): activate inbound, wait until :inbound_port is
# listening, origin A, HAProxy origin SNI, then controller-side Yandex Origin
# Group + CDN Resource + public Cloudflare CNAME.
#
# Yandex/Cloudflare CDN API calls use delegate_to: localhost so
# --limit panel:HOST does not skip cloud provisioning.
# Ordinary make nodes keeps the AntiBlock inbound via remnawave_inbound_tags_extra.
# Origin DNS uses antiblock_cdn_origin_dns_records; public CNAME uses the
# runtime list from roles/yandex_cdn. Group vars do not set generic
# cf_dns_records.

- name: AntiBlock CDN | Ensure inbound and Internal Squad membership
  hosts: panel
  gather_facts: false
  tags: [antiblock_cdn, antiblock_cdn_inbound]
  roles:
    - role: remnawave_inbounds
      when: antiblock_cdn_enabled | bool
      vars:
        remnawave_inbounds:
          - "{{ antiblock_cdn_inbound }}"
        remnawave_inbounds_managed:
          - "{{ antiblock_cdn_inbound_tag }}"
        remnawave_tag_collision_mode: "{{ antiblock_cdn_tag_collision_mode }}"
        remnawave_update_mode: replace
        remnawave_register_inbounds_in_squad: false
        remnawave_inbound_squad_memberships:
          - inbound_tag: "{{ antiblock_cdn_inbound_tag }}"
            present_in:
              - "{{ antiblock_cdn_internal_squad }}"
            absent_from: "{{ antiblock_cdn_forbidden_internal_squads }}"

- name: AntiBlock CDN | Origin node, Yandex CDN, and public CNAME
  hosts: antiblock_cdn_nodes
  gather_facts: false
  tags: [antiblock_cdn, antiblock_cdn_nodes]
  roles:
    - role: remnawave_register_node
      when: antiblock_cdn_enabled | bool
  tasks:
    - name: AntiBlock CDN | Wait until origin inbound is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ antiblock_cdn_inbound_port | int }}"
        state: started
        timeout: "{{ antiblock_cdn_origin_listen_timeout | int }}"
      when: antiblock_cdn_enabled | bool
      tags: [antiblock_cdn, antiblock_cdn_nodes, antiblock_cdn_origin_ready]

    - name: AntiBlock CDN | Ensure origin A record
      ansible.builtin.include_role:
        name: cf_dns
      when:
        - antiblock_cdn_enabled | bool
        - (antiblock_cdn_node.origin_hostname | default('') | length) > 0
        - (antiblock_cdn_origin_dns_records | default([]) | length) > 0
      vars:
        cf_dns_zone: "{{ antiblock_cdn_certificate.dns_zone }}"
        cf_dns_records: "{{ antiblock_cdn_origin_dns_records }}"
        cf_dns_state: present
        cf_dns_proxied_default: false
      tags: [antiblock_cdn, antiblock_cdn_nodes]

    - name: AntiBlock CDN | Ensure HAProxy origin SNI route
      ansible.builtin.include_role:
        name: remnawave_node_haproxy
        apply:
          become: true
      when: antiblock_cdn_enabled | bool
      tags: [antiblock_cdn, antiblock_cdn_nodes]

    - name: AntiBlock CDN | Ensure Yandex Origin Group and CDN Resource
      ansible.builtin.include_role:
        name: yandex_cdn
        apply:
          delegate_to: localhost
          become: false
      when: antiblock_cdn_enabled | bool
      vars:
        yandex_cdn_folder_id: "{{ antiblock_cdn_yc_folder_id }}"
        yandex_cdn_public_hostname: "{{ antiblock_cdn_node.public_hostname }}"
        yandex_cdn_origin_hostname: "{{ antiblock_cdn_node.origin_hostname }}"
        yandex_cdn_origin_group_name: "{{ antiblock_cdn_node.origin_group_name }}"
        yandex_cdn_origin_group_use_next: "{{ antiblock_cdn_node.origin_group_use_next | bool }}"
        yandex_cdn_certificate_mode: "{{ antiblock_cdn_node.certificate_mode }}"
        yandex_cdn_certificate_name: "{{ antiblock_cdn_certificate.name }}"
        yandex_cdn_certificate_domains: "{{ antiblock_cdn_certificate.domains }}"
        yandex_cdn_dns_zone: "{{ antiblock_cdn_certificate.dns_zone }}"
        yandex_cdn_allow_writes: true
        yandex_cdn_sa_authorized_key: "{{ vault_yandex_cloud_sa_authorized_key | default('') }}"
        yandex_cdn_iam_token: "{{ vault_yandex_cloud_iam_token | default('') }}"
      tags: [antiblock_cdn, antiblock_cdn_nodes, antiblock_cdn_yandex]

    - name: AntiBlock CDN | Ensure public CDN CNAME
      ansible.builtin.include_role:
        name: cf_dns
        apply:
          delegate_to: localhost
          become: false
      when:
        - antiblock_cdn_enabled | bool
        - (yandex_cdn_public_dns_records | default([]) | length) > 0
      vars:
        cf_dns_zone: "{{ antiblock_cdn_certificate.dns_zone }}"
        cf_dns_records: "{{ yandex_cdn_public_dns_records }}"
        cf_dns_state: present
        cf_dns_proxied_default: false
      tags: [antiblock_cdn, antiblock_cdn_nodes, antiblock_cdn_yandex]
