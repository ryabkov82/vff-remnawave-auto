---
# Remnawave AntiBlock Hosts (current Host API). Stage 6A: adopt + create.
# Stage 6B.2: guarded DELETE of prune_eligible stale Hosts.
# Default is plan-only (no POST/PATCH/DELETE).
# DELETE requires both allow_writes=true and prune=true. No third flag.

remnawave_panel_api_base: "{{ (remnawave_panel_url | default('')) | ternary(remnawave_panel_url ~ '/api', '') }}"
remnawave_panel_api_token: ""

antiblock_cdn_host_owner_tag: "VFF:ANTIBLOCK"
antiblock_cdn_hosts_allow_writes: false
antiblock_cdn_hosts_prune: false

antiblock_cdn_host_port: 443
antiblock_cdn_host_alpn: "h2,http/1.1"
antiblock_cdn_host_fingerprint: "firefox"
antiblock_cdn_host_security_layer: "TLS"
antiblock_cdn_host_is_disabled: false
antiblock_cdn_host_is_hidden: false
antiblock_cdn_host_override_sni_from_address: false
antiblock_cdn_host_keep_sni_blank: false
antiblock_cdn_host_shuffle_host: false
antiblock_cdn_host_mihomo_x25519: false

# Required per CDN node in host_vars. Display-name prefix for Remnawave Hosts.
# No inventory_hostname fallback. Example: "🇩🇪 Germany 2"
# antiblock_cdn_remark_prefix: ""

# Shared xHTTP extra params. Inventory overrides this object; do not copy per Host.
antiblock_cdn_host_xhttp_extra_params: {}
