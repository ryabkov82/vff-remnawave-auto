---
# Resolve remnawave_secret_key before prepare.yml writes .env.
# Precedence: explicit/Vault -> existing .env -> GET /api/keygen.
# GET /api/keygen generates a new Node SECRET_KEY (HTTP GET has side effects).
# Existing .env with a non-empty SECRET_KEY is the source of truth: do not
# call keygen and do not rewrite the file. Never validate key format.
# Never write the key to inventory/vault or print it.

- name: Remnawave Node | Detect explicit SECRET_KEY
  ansible.builtin.set_fact:
    _rw_node_has_secret_key: "{{ (remnawave_secret_key | default('') | trim | length) > 0 }}"
    _rw_node_preserve_existing_env: false
  no_log: true

- name: Remnawave Node | Stat existing .env for SECRET_KEY
  when: not (_rw_node_has_secret_key | bool)
  ansible.builtin.stat:
    path: "{{ remnawave_node_secret_key_env_path }}"
  register: _rw_node_env_stat

- name: Remnawave Node | Read existing .env SECRET_KEY
  when:
    - not (_rw_node_has_secret_key | bool)
    - _rw_node_env_stat.stat.exists | default(false)
  ansible.builtin.slurp:
    src: "{{ remnawave_node_secret_key_env_path }}"
  register: _rw_node_env_slurp
  no_log: true

- name: Remnawave Node | Parse SECRET_KEY from existing .env
  when:
    - not (_rw_node_has_secret_key | bool)
    - _rw_node_env_stat.stat.exists | default(false)
  ansible.builtin.set_fact:
    _rw_node_env_secret: >-
      {{
        (
          _rw_node_env_slurp.content
          | b64decode
          | regex_search('(?m)^SECRET_KEY=[^\\r\\n]+')
          | default('', true)
          | regex_replace('^SECRET_KEY=', '')
          | trim
          | regex_replace('^"(.*)"$', '\1')
        )
      }}
  no_log: true

- name: Remnawave Node | Use SECRET_KEY from existing .env
  when:
    - not (_rw_node_has_secret_key | bool)
    - (_rw_node_env_secret | default('') | length) > 0
  ansible.builtin.set_fact:
    remnawave_secret_key: "{{ _rw_node_env_secret }}"
    _rw_node_has_secret_key: true
    _rw_node_preserve_existing_env: true
  no_log: true

- name: Remnawave Node | Refuse keygen in check mode
  when:
    - not (_rw_node_has_secret_key | bool)
    - remnawave_node_secret_key_auto | bool
    - remnawave_node_write_env | bool
    - ansible_check_mode
  ansible.builtin.fail:
    msg: SECRET_KEY is absent and cannot be generated in check mode.

- name: Remnawave Node | Assert panel URL and token for keygen
  when:
    - not (_rw_node_has_secret_key | bool)
    - remnawave_node_secret_key_auto | bool
    - remnawave_node_write_env | bool
    - not ansible_check_mode
  ansible.builtin.assert:
    that:
      - (remnawave_panel_url | default('') | length) > 0
      - (remnawave_panel_api_token | default('') | length) > 0
    fail_msg: >-
      SECRET_KEY is absent. Set remnawave_secret_key or provide
      remnawave_panel_url and remnawave_panel_api_token for GET /api/keygen.
  no_log: true

- name: Remnawave Node | GET /api/keygen
  when:
    - not (_rw_node_has_secret_key | bool)
    - remnawave_node_secret_key_auto | bool
    - remnawave_node_write_env | bool
    - not ansible_check_mode
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | trim | regex_replace('/+$', '') }}{{ remnawave_node_secret_key_api_path }}"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_api_token }}"
      Accept: application/json
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _rw_node_keygen
  failed_when: false
  changed_when: false
  no_log: true

- name: Remnawave Node | Fail keygen without leaking response
  when:
    - _rw_node_keygen is defined
    - _rw_node_keygen is not skipped
    - (_rw_node_keygen.status | default(0) | int) != 200
  ansible.builtin.fail:
    msg: >-
      Remnawave keygen failed (HTTP {{ _rw_node_keygen.status | default('unknown') }}).
      Ensure API token has keygen:get scope.

- name: Remnawave Node | Assert keygen returned secretKey
  when:
    - _rw_node_keygen is defined
    - _rw_node_keygen is not skipped
    - (_rw_node_keygen.status | default(0) | int) == 200
  ansible.builtin.assert:
    that:
      - (_rw_node_keygen.json.response.secretKey | default('') | length) > 0
    fail_msg: Remnawave keygen HTTP 200 but response.secretKey is missing or empty.
  no_log: true

- name: Remnawave Node | Set remnawave_secret_key from keygen
  when:
    - _rw_node_keygen is defined
    - _rw_node_keygen is not skipped
    - (_rw_node_keygen.status | default(0) | int) == 200
  ansible.builtin.set_fact:
    remnawave_secret_key: "{{ _rw_node_keygen.json.response.secretKey }}"
    _rw_node_has_secret_key: true
  no_log: true

- name: Remnawave Node | Assert SECRET_KEY is resolved
  when: remnawave_node_write_env | bool
  ansible.builtin.assert:
    that:
      - (remnawave_secret_key | default('') | trim | length) > 0
    fail_msg: >-
      Failed to resolve remnawave_secret_key from vault, existing .env, or /api/keygen.
  no_log: true
