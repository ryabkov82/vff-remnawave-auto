---
# =====================================================================
# BUILD SNI MAP (shared role)
# =====================================================================

- name: Build SNI→PORT map using remnawave_sni_map
  ansible.builtin.include_role:
    name: remnawave_sni_map
  vars:
    remnawave_sni_node_name: "{{ remnawave_node_name | default(inventory_hostname) }}"
    remnawave_sni_api_base_url: "{{ remnawave_api_base_url }}"
    remnawave_sni_api_token: "{{ remnawave_panel_api_token }}"
  tags: ['sni_map']

- name: Prepare extra static SNI routes
  ansible.builtin.set_fact:
    _haproxy_extra_sni: "{{ haproxy_node_extra_sni_routes | default([]) | haproxy_prepare_extra_sni_routes(_sni_port_map | default({})) }}"
  tags: ['haproxy', 'node_haproxy']

- name: Fail if extra SNI routes collide or are invalid
  ansible.builtin.assert:
    that:
      - _haproxy_extra_sni.ok | bool
    fail_msg: |-
      Extra HAProxy SNI routes are invalid (no haproxy.cfg change):
      - {{ (_haproxy_extra_sni.errors | default([])) | join('\n- ') }}
  tags: ['haproxy', 'node_haproxy']

- name: Expose prepared extra SNI routes for the template
  ansible.builtin.set_fact:
    _haproxy_extra_sni_routes: "{{ _haproxy_extra_sni.routes }}"
  tags: ['haproxy', 'node_haproxy']

- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true

# ========= 7) Render haproxy.cfg ==============================================
- name: Render haproxy.cfg
  ansible.builtin.template:
    src: haproxy_node.cfg.j2
    dest: "{{ haproxy_cfg_path }}"
    mode: "0644"
    validate: "{{ haproxy_validate_cmd }}"
  notify: Reload HAProxy

# ========= 8) Ensure HAProxy running ==========================================
- name: Ensure HAProxy enabled and running
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
