---
- name: "Ensure host | Reset per-item working facts"
  ansible.builtin.set_fact:
    _inbound_uuid: ""
    _profile_uuid: ""
    _rw_existing: null
    _rw_effective_uuid: ""
    _rw_inbound_differs: false
    _rw_port_differs: false
    _rw_remark_rename_planned: false
    _rw_remark_rename_performed: false
    _rw_sni_base: []
    _rw_sni_list: []
    _rw_sni_csv: ""

- name: Ensure host item has required fields
  ansible.builtin.assert:
    that:
      - (rw_item.remark | default('') | length) > 0
      - (rw_item.address | default('') | length) > 0
      - (rw_item.inbound_tag | default('') | trim | length) > 0
    fail_msg: "Host item must provide remark, address and inbound_tag."

# ---------------------------------------------------------
# Resolve inbound/profile UUIDs for this host:
# 1) rw_item explicit inbound_uuid/profile_uuid (optional override)
# 2) from mapping remnawave_inbounds_by_tag (preferred)
# 3) fallback to API (global inbounds) and extend cache
# ---------------------------------------------------------

# 1) per-host override
- name: Use per-host inbound/profile UUID override if present
  ansible.builtin.set_fact:
    _inbound_uuid: "{{ rw_item.inbound_uuid }}"
    _profile_uuid: "{{ rw_item.profile_uuid }}"
  when:
    - (rw_item.inbound_uuid | default('') | length) > 0
    - (rw_item.profile_uuid | default('') | length) > 0

# 2) diagnostic guard (only when no override)
- name: Assert inbound_tag exists in cache when no per-host override
  ansible.builtin.assert:
    that:
      - (
          (_inbound_uuid | default('') | length) > 0
          and (_profile_uuid | default('') | length) > 0
        )
        or (rw_item.inbound_tag in (_rw_inbounds_by_tag | default({})))
    fail_msg: >-
      inbound_tag={{ rw_item.inbound_tag }} not found in remnawave_inbounds_by_tag.
      Ensure remnawave_register_node exported remnawave_inbounds_by_tag
      or run remnawave_inbounds_cache before remnawave_add_host.

# 3) mapping resolve
- name: Resolve inbound/profile from mapping (preferred)
  ansible.builtin.set_fact:
    _inbound_uuid: "{{ _rw_inbounds_by_tag[rw_item.inbound_tag].inbound_uuid }}"
    _profile_uuid: "{{ _rw_inbounds_by_tag[rw_item.inbound_tag].profile_uuid }}"
  when:
    - (_inbound_uuid | default('') | length) == 0 or (_profile_uuid | default('') | length) == 0
    - rw_item.inbound_tag in (_rw_inbounds_by_tag | default({}))

# 4) final assert
- name: Final assert on resolved inbound/profile UUIDs
  ansible.builtin.assert:
    that:
      - (_inbound_uuid | default('') | length) > 0
      - (_profile_uuid | default('') | length) > 0
    fail_msg: "Failed to resolve inbound/profile UUIDs for inbound_tag={{ rw_item.inbound_tag }}"

# ---------------------------------------------------------
# Build SNI list (string/list -> CSV)
# ---------------------------------------------------------
- name: Hosts | Init SNI base list
  ansible.builtin.set_fact:
    _rw_sni_base: []

- name: Hosts | Use SNI from string (possibly comma-separated)
  when:
    - rw_item.sni is defined
    - rw_item.sni is string
    - (rw_item.sni | trim | length) > 0
  ansible.builtin.set_fact:
    _rw_sni_base: "{{ rw_item.sni | trim | split(',') | map('trim') | list }}"

- name: Hosts | Use SNI from list/sequence
  when:
    - rw_item.sni is defined
    - rw_item.sni is sequence
    - not (rw_item.sni is string)
  ansible.builtin.set_fact:
    _rw_sni_base: "{{ rw_item.sni | map('string') | map('trim') | reject('equalto', '') | list }}"

- name: Hosts | Ensure SNI has at least address fallback
  ansible.builtin.set_fact:
    _rw_sni_list: >-
      {{
        (_rw_sni_base | reject('equalto','') | list | unique)
        if (_rw_sni_base | reject('equalto','') | list | length > 0)
        else [rw_item.address]
      }}

- name: Hosts | Build CSV SNI
  ansible.builtin.set_fact:
    _rw_sni_csv: "{{ _rw_sni_list | join(',') }}"

# ---------------------------------------------------------
# Patch REALITY serverNames (optional per-host, default true)
# ---------------------------------------------------------
- name: Hosts | Patch REALITY serverNames with host SNI names
  when: (rw_item.patch_reality_servernames | default(true)) | bool
  ansible.builtin.include_role:
    name: remnawave_reality_servernames
  vars:
    remnawave_reality_profile_uuid: "{{ _profile_uuid }}"
    remnawave_reality_inbound_uuid: "{{ _inbound_uuid }}"
    remnawave_reality_inbound_tag: "{{ rw_item.inbound_tag | default('') }}"
    remnawave_reality_add_servernames: "{{ _rw_sni_list }}"

# ---------------------------------------------------------
# Select existing host (from prefetched list)
# Modes: remark | address_port (legacy) | endpoint_inbound (safe)
# Never create when match is ambiguous.
# ---------------------------------------------------------
- name: Assert known rw_host_match_by
  ansible.builtin.assert:
    that:
      - rw_host_match_by in ['remark', 'address_port', 'endpoint_inbound']
    fail_msg: >-
      Unknown rw_host_match_by={{ rw_host_match_by }}.
      Allowed: remark, address_port, endpoint_inbound.

- name: Assert desired remark is non-empty
  ansible.builtin.assert:
    that:
      - (rw_item.remark | default('') | trim | length) > 0
    fail_msg: Desired Host remark is empty; refusing to continue.

- name: Collect Host match candidates
  ansible.builtin.set_fact:
    _rw_match_candidates: >-
      {%- if rw_host_match_by == 'address_port' -%}
      {{
        _rw_hosts_existing
        | selectattr('address', 'equalto', rw_item.address)
        | selectattr('port', 'equalto', (rw_item.port | default(443) | int))
        | list
      }}
      {%- elif rw_host_match_by == 'endpoint_inbound' -%}
      {{
        _rw_hosts_existing
        | selectattr('address', 'equalto', rw_item.address)
        | selectattr('port', 'equalto', (rw_item.port | default(443) | int))
        | selectattr('inbound.configProfileUuid', 'equalto', _profile_uuid)
        | selectattr('inbound.configProfileInboundUuid', 'equalto', _inbound_uuid)
        | list
      }}
      {%- else -%}
      {{
        _rw_hosts_existing
        | selectattr('remark', 'equalto', rw_item.remark)
        | list
      }}
      {%- endif -%}

- name: Fail on ambiguous Host match (never create)
  when: (_rw_match_candidates | default([]) | length) > 1
  ansible.builtin.fail:
    msg: >-
      Ambiguous Host match for match_by={{ rw_host_match_by }}
      address={{ rw_item.address }} port={{ rw_item.port | default(443) }}
      inbound_tag={{ rw_item.inbound_tag }} remark={{ rw_item.remark }}
      profile_uuid={{ _profile_uuid }} inbound_uuid={{ _inbound_uuid }}
      candidate_uuids={{ _rw_match_candidates | map(attribute='uuid') | list }}
      candidate_remarks={{ _rw_match_candidates | map(attribute='remark') | list }}.
      Refusing to create or update.

- name: Select existing host (0 -> missing, 1 -> selected)
  ansible.builtin.set_fact:
    _rw_existing: >-
      {{
        (_rw_match_candidates | first)
        if ((_rw_match_candidates | default([]) | length) == 1)
        else None
      }}

- name: Maybe delete existing host if force_recreate
  when: _rw_existing is not none and rw_host_force_recreate | bool
  block:
    - name: Build SNI list to remove from REALITY (force_recreate)
      ansible.builtin.set_fact:
        _rw_existing_sni_list: >-
          {{
            (
              (_rw_existing.sni | default('') | string)
              | split(',')
              | map('trim')
              | reject('equalto','')
              | list
            )
            if ((_rw_existing.sni | default('') | string) | trim | length) > 0
            else [ _rw_existing.address ]
          }}

    - name: Hosts | Remove old SNI from REALITY serverNames (force_recreate)
      when: (rw_item.patch_reality_servernames | default(true)) | bool
      ansible.builtin.include_role:
        name: remnawave_reality_servernames
      vars:
        remnawave_reality_profile_uuid: "{{ _rw_existing.inbound.configProfileUuid }}"
        remnawave_reality_inbound_uuid: "{{ _rw_existing.inbound.configProfileInboundUuid }}"
        remnawave_reality_inbound_tag: ""          # можно не передавать
        remnawave_reality_add_servernames: []
        remnawave_reality_remove_servernames: "{{ _rw_existing_sni_list }}"

    - name: Delete host
      ansible.builtin.uri:
        url: "{{ remnawave_panel_api_base }}/hosts/{{ _rw_existing.uuid }}"
        method: DELETE
        headers: "{{ _rw_headers }}"
        status_code: [200]
      register: _rw_delete

    - name: Clear existing after delete
      ansible.builtin.set_fact:
        _rw_existing: null

# ---------------------------------------------------------
# Build create payload (tag is managed marker)
# ---------------------------------------------------------
- name: Build create payload
  ansible.builtin.set_fact:
    _rw_create_body:
      remark: "{{ rw_item.remark }}"
      address: "{{ rw_item.address }}"
      port: "{{ (rw_item.port | default(443) | int) }}"
      path: "{{ rw_item.path | default('') }}"
      sni: "{{ _rw_sni_csv }}"
      host: "{{ rw_item.host | default('') }}"
      alpn: "{{ rw_item.alpn | default(None) }}"
      fingerprint: "{{ rw_item.fingerprint | default('chrome') }}"
      securityLayer: "{{ rw_item.securityLayer | default('DEFAULT') }}"
      inbound:
        configProfileUuid: "{{ _profile_uuid }}"
        configProfileInboundUuid: "{{ _inbound_uuid }}"
      serverDescription: "{{ rw_item.serverDescription | default('') }}"
      tag: "{{ rw_host_managed_tag }}"
      isHidden: "{{ (rw_item.isHidden | default(false)) | bool }}"
      overrideSniFromAddress: "{{ (rw_item.overrideSniFromAddress | default(false)) | bool }}"
      vlessRouteId: "{{ rw_item.vlessRouteId | default(None) }}"
      allowInsecure: "{{ (rw_item.allowInsecure | default(false)) | bool }}"
      shuffleHost: "{{ (rw_item.shuffleHost | default(true)) | bool }}"
      mihomoX25519: "{{ (rw_item.mihomoX25519 | default(false)) | bool }}"
      nodes: ["{{ _node_uuid }}"]

- name: Create host if missing
  when: _rw_existing is none
  block:
    - name: POST /api/hosts
      ansible.builtin.uri:
        url: "{{ remnawave_panel_api_base }}/hosts"
        method: POST
        headers: "{{ _rw_headers }}"
        body_format: json
        body: "{{ _rw_create_body }}"
        status_code: [201]
        return_content: true
      register: _rw_created

    - name: Remember created host uuid
      when:
        - _rw_created is defined
        - _rw_created.json is defined
        - _rw_created.json.response is defined
        - _rw_created.json.response.uuid is defined
      ansible.builtin.set_fact:
        _rw_effective_uuid: "{{ _rw_created.json.response.uuid }}"

- name: Set effective uuid when existing
  when: _rw_existing is not none
  ansible.builtin.set_fact:
    _rw_effective_uuid: "{{ _rw_existing.uuid }}"

- name: Decide if inbound differs on existing host
  when: _rw_existing is not none
  ansible.builtin.set_fact:
    _rw_inbound_differs: >-
      {{
        (_rw_existing.inbound.configProfileUuid | default('')) != _profile_uuid
        or (_rw_existing.inbound.configProfileInboundUuid | default('')) != _inbound_uuid
      }}

- name: Reconcile inbound on existing host (bulk set-inbound)
  when:
    - _rw_existing is not none
    - rw_host_set_inbound_if_exists | bool
    - _rw_inbound_differs | bool
  ansible.builtin.uri:
    url: "{{ remnawave_panel_api_base }}/hosts/bulk/set-inbound"
    method: POST
    headers: "{{ _rw_headers }}"
    body_format: json
    body:
      uuids: ["{{ _rw_effective_uuid }}"]
      configProfileUuid: "{{ _profile_uuid }}"
      configProfileInboundUuid: "{{ _inbound_uuid }}"
    status_code: [200]
    return_content: true
  register: _rw_bulk_inbound

- name: Decide if port differs on existing host
  when: _rw_existing is not none
  ansible.builtin.set_fact:
    _rw_port_differs: "{{ (_rw_existing.port | int) != (rw_item.port | default(443) | int) }}"

- name: Optionally set port on existing host (bulk set-port)
  when:
    - _rw_existing is not none
    - rw_host_set_port_if_exists | bool
    - _rw_port_differs | bool
  ansible.builtin.uri:
    url: "{{ remnawave_panel_api_base }}/hosts/bulk/set-port"
    method: POST
    headers: "{{ _rw_headers }}"
    body_format: json
    body:
      uuids: ["{{ _rw_effective_uuid }}"]
      port: "{{ (rw_item.port | default(443) | int) }}"
    status_code: [200]
    return_content: true
  register: _rw_bulk_port

# ---------------------------------------------------------
# Optional remark rename (PATCH /api/hosts, partial {uuid,remark})
# Safe only with endpoint_inbound. Off by default.
# ---------------------------------------------------------
- name: Decide if remark differs on existing host
  when: _rw_existing is not none
  ansible.builtin.set_fact:
    _rw_remark_differs: "{{ (_rw_existing.remark | default('')) != (rw_item.remark | default('')) }}"

- name: Init remark-differs when host is new
  when: _rw_existing is none
  ansible.builtin.set_fact:
    _rw_remark_differs: false

- name: Guard rename requires confirmed API contract
  when:
    - _rw_existing is not none
    - rw_host_set_remark_if_exists | bool
    - _rw_remark_differs | bool
  ansible.builtin.assert:
    that:
      - rw_host_update_api_confirmed | bool
      - (rw_host_update_api_method | upper) == 'PATCH'
      - rw_host_update_api_path == '/hosts'
    fail_msg: >-
      Remark rename refused: API update contract is not confirmed
      (expected PATCH /hosts partial {uuid,remark} for Remnawave 2.7.4).

- name: Guard rename requires safe match mode endpoint_inbound
  when:
    - _rw_existing is not none
    - rw_host_set_remark_if_exists | bool
    - _rw_remark_differs | bool
  ansible.builtin.assert:
    that:
      - rw_host_match_by == 'endpoint_inbound'
    fail_msg: >-
      Remark rename refused: rw_host_match_by must be endpoint_inbound
      (current={{ rw_host_match_by }}). address_port is ambiguous for Reality/xHTTP.

- name: Guard rename of unmanaged Host
  when:
    - _rw_existing is not none
    - rw_host_set_remark_if_exists | bool
    - _rw_remark_differs | bool
    - (_rw_existing.tag | default('')) != rw_host_managed_tag
    - not (rw_host_allow_unmanaged_update | bool)
  ansible.builtin.fail:
    msg: >-
      Refusing to rename unmanaged Host uuid={{ _rw_existing.uuid }}
      tag={{ _rw_existing.tag | default('') }}
      old_remark={{ _rw_existing.remark }} new_remark={{ rw_item.remark }}.
      Set rw_host_allow_unmanaged_update=true to allow explicitly.

- name: Mark remark rename as planned (check mode)
  when:
    - _rw_existing is not none
    - rw_host_set_remark_if_exists | bool
    - _rw_remark_differs | bool
    - ansible_check_mode
  ansible.builtin.set_fact:
    _rw_remark_rename_planned: true
  changed_when: false

- name: Plan remark rename (check mode only)
  when:
    - _rw_existing is not none
    - rw_host_set_remark_if_exists | bool
    - _rw_remark_differs | bool
    - ansible_check_mode
  ansible.builtin.debug:
    msg:
      planned_rename: true
      uuid: "{{ _rw_existing.uuid }}"
      old_remark: "{{ _rw_existing.remark }}"
      new_remark: "{{ rw_item.remark }}"
      match_by: "{{ rw_host_match_by }}"
  changed_when: true

- name: "PATCH /api/hosts (remark only)"
  when:
    - _rw_existing is not none
    - rw_host_set_remark_if_exists | bool
    - _rw_remark_differs | bool
    - not ansible_check_mode
  block:
    - name: Build partial remark update payload
      ansible.builtin.set_fact:
        _rw_remark_patch_body:
          uuid: "{{ _rw_existing.uuid }}"
          remark: "{{ rw_item.remark }}"
      changed_when: false

    - name: Update Host remark via confirmed PATCH contract
      ansible.builtin.uri:
        url: "{{ remnawave_panel_api_base }}{{ rw_host_update_api_path }}"
        method: "{{ rw_host_update_api_method | upper }}"
        headers: "{{ _rw_headers }}"
        body_format: json
        body: "{{ _rw_remark_patch_body }}"
        status_code: [200]
        return_content: true
      register: _rw_remark_patch
      no_log: true
      failed_when: false
      changed_when: (_rw_remark_patch.status | default(0) | int) == 200

    - name: Fail on remark update API error (no create/delete fallback)
      when: (_rw_remark_patch.status | default(0) | int) != 200
      ansible.builtin.fail:
        msg: >-
          Host remark PATCH failed for uuid={{ _rw_existing.uuid }}
          status={{ _rw_remark_patch.status | default('n/a') }}.
          Refusing create/delete fallback.

    - name: Validate remark update response
      vars:
        _resp: "{{ _rw_remark_patch.json.response | default({}) }}"
      ansible.builtin.assert:
        that:
          - (_resp.uuid | default('')) == (_rw_existing.uuid | string)
          - (_resp.remark | default('')) == (rw_item.remark | string)
        fail_msg: >-
          Remark update response invalid:
          uuid={{ _resp.uuid | default('') }} remark={{ _resp.remark | default('') }}
          expected_uuid={{ _rw_existing.uuid }} expected_remark={{ rw_item.remark }}

    - name: Mark remark rename as performed
      ansible.builtin.set_fact:
        _rw_remark_rename_performed: true
      changed_when: false

    - name: Refresh local existing Host remark after rename
      ansible.builtin.set_fact:
        _rw_existing: "{{ _rw_existing | combine({'remark': rw_item.remark}, recursive=True) }}"
        _rw_remark_differs: false
      changed_when: false

    - name: Refresh _rw_hosts_existing after rename (for loop + prune)
      vars:
        tmp: >-
          {%- set out = [] -%}
          {%- for h in _rw_hosts_existing -%}
            {%- if (h.uuid | string) == (_rw_effective_uuid | string) -%}
              {%- set _ = out.append(h | combine({'remark': rw_item.remark}, recursive=True)) -%}
            {%- else -%}
              {%- set _ = out.append(h) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | to_json }}
      ansible.builtin.set_fact:
        _rw_hosts_existing: "{{ tmp | from_json }}"
      changed_when: false

- name: Output result
  ansible.builtin.debug:
    msg:
      created: "{{ _rw_existing is none }}"
      host_uuid: "{{ _rw_effective_uuid }}"
      inbound_tag: "{{ rw_item.inbound_tag }}"
      managed_tag: "{{ rw_host_managed_tag }}"
      remark_rename_planned: "{{ _rw_remark_rename_planned | bool }}"
      remark_renamed: "{{ _rw_remark_rename_performed | bool }}"
      match_by: "{{ rw_host_match_by }}"
