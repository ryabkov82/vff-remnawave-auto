---
- name: Assert production subscription domain is set
  ansible.builtin.assert:
    that:
      - remnawave_sub_public_domain | default('') | trim | length > 0
    fail_msg: remnawave_sub_public_domain must be set for rollback.

- name: Resolve production subscription upstream for rollback plan
  ansible.builtin.import_tasks: set_upstream_effective.yml

- name: Check stable legacy production subscription backup exists
  ansible.builtin.stat:
    path: "{{ remnawave_subscription_nginx_legacy_backup_file }}"
  register: _sub_rollback_legacy_backup

- name: Report production subscription rollback availability
  ansible.builtin.debug:
    msg:
      stable_legacy_backup_exists: >-
        {{ _sub_rollback_legacy_backup.stat.exists | default(false) }}
      rollback_available: >-
        {{ _sub_rollback_legacy_backup.stat.exists | default(false) }}
      rollback_target_marker: "{{ remnawave_subscription_legacy_upstream_marker }}"
      rollback_strategy: declarative_legacy_template_render
      note: >-
        {{
          'Rollback will render the production template with upstream selector legacy. '
          'The stable legacy backup remains an immutable historical artifact for '
          'automatic rescue and manual emergency restore.'
          if (_sub_rollback_legacy_backup.stat.exists | default(false))
          else 'Rollback will become available after the first successful make sub-cutover creates subscription-prod-legacy.conf.'
        }}

- name: Assert stable legacy production backup is available for rollback apply
  ansible.builtin.assert:
    that:
      - _sub_rollback_legacy_backup.stat.exists | default(false)
      - _sub_rollback_legacy_backup.stat.isreg | default(false)
    fail_msg: >-
      Legacy production backup not found:
      {{ remnawave_subscription_nginx_legacy_backup_file }}.
      Rollback is not available yet. Run make sub-cutover first to create the
      stable legacy backup during the first successful cutover.
  when: not ansible_check_mode

- name: Fail rollback check when stable legacy backup is missing
  ansible.builtin.fail:
    msg: >-
      Legacy production backup not found:
      {{ remnawave_subscription_nginx_legacy_backup_file }}.
      Rollback will become available after the first successful make sub-cutover.
  when:
    - ansible_check_mode
    - not (_sub_rollback_legacy_backup.stat.exists | default(false))

- name: Perform explicit production subscription rollback apply
  when: not ansible_check_mode
  block:
    - name: Ensure production Nginx backup directory exists for rollback
      ansible.builtin.file:
        path: "{{ remnawave_subscription_nginx_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Read current production subscription vhost before rollback render
      ansible.builtin.slurp:
        path: "{{ remnawave_nginx_sites_dir }}/{{ remnawave_nginx_subscription_site }}"
      register: _sub_rollback_pre_vhost
      failed_when: false
      check_mode: false

    - name: Create timestamp backup of current production subscription vhost before rollback
      ansible.builtin.copy:
        dest: >-
          {{ remnawave_subscription_nginx_backup_dir }}/subscription-prod-before-rollback-{{
          ansible_date_time.date | replace('-', '') }}-{{ ansible_date_time.hour }}{{
          ansible_date_time.minute }}{{ ansible_date_time.second }}.conf
        content: "{{ _sub_rollback_pre_vhost.content | b64decode }}"
        owner: root
        group: root
        mode: "0600"
      register: _sub_rollback_timestamp_backup
      when: _sub_rollback_pre_vhost.content is defined

    - name: Render production subscription vhost with legacy upstream
      ansible.builtin.include_tasks: render_production_subscription_vhost.yml

    - name: Apply production subscription rollback Nginx configuration
      ansible.builtin.meta: flush_handlers

    - name: Read production subscription vhost after rollback render
      ansible.builtin.slurp:
        path: "{{ remnawave_nginx_sites_dir }}/{{ remnawave_nginx_subscription_site }}"
      register: _sub_rollback_post_vhost
      check_mode: false

    - name: Assert production subscription vhost contains legacy upstream marker after rollback
      ansible.builtin.assert:
        that:
          - >-
            remnawave_subscription_legacy_upstream_marker in
            (_sub_rollback_post_vhost.content | b64decode)
          - >-
            remnawave_subscription_next_upstream_marker not in
            (_sub_rollback_post_vhost.content | b64decode)
        fail_msg: >-
          Production vhost {{ remnawave_nginx_sites_dir }}/{{ remnawave_nginx_subscription_site }}
          does not contain expected legacy upstream marker after rollback.

    - name: Verify production HTTPS subscription page after rollback
      ansible.builtin.uri:
        url: >-
          https://{{ remnawave_sub_public_domain }}/{{ remnawave_subscription_prod_healthcheck_short_uuid }}
        method: GET
        headers:
          Accept: text/html
          User-Agent: "{{ remnawave_subscription_prod_rollback_healthcheck_user_agent }}"
        status_code: 200
        return_content: false
        validate_certs: true
        use_proxy: false
        force: true
        timeout: 15
      delegate_to: localhost
      become: false
      register: _sub_rollback_prod_health
      retries: 10
      delay: 3
      until: >-
        (_sub_rollback_prod_health.status | default(0) | int) == 200 and
        (
          'text/html' in (_sub_rollback_prod_health.content_type | default('') | lower) or
          'text/plain' in (_sub_rollback_prod_health.content_type | default('') | lower)
        ) and
        (_sub_rollback_prod_health.x_vff_subscription_target | default('') | lower) == 'legacy'
      changed_when: false
      when: remnawave_subscription_prod_healthcheck_short_uuid | trim | length > 0
      no_log: true

  rescue:
    - name: Build sanitized production rollback health check diagnostics
      ansible.builtin.set_fact:
        remnawave_subscription_rollback_health_diagnostics: >-
          {{
            _sub_rollback_prod_health | default({})
            | remnawave_subscription_uri_health_diagnostics('public_external', 'legacy')
          }}

    - name: Report sanitized production rollback health check diagnostics
      ansible.builtin.debug:
        msg: "{{ remnawave_subscription_rollback_health_diagnostics }}"

    - name: Restore production subscription vhost from rollback timestamp backup
      ansible.builtin.copy:
        src: "{{ _sub_rollback_timestamp_backup.dest }}"
        dest: "{{ remnawave_nginx_sites_dir }}/{{ remnawave_nginx_subscription_site }}"
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      when: _sub_rollback_timestamp_backup.dest is defined
      notify: Reload Nginx (systemd)

    - name: Apply production subscription rollback rescue Nginx configuration
      ansible.builtin.meta: flush_handlers

    - name: Probe production subscription public HTTPS transport after rollback rescue
      ansible.builtin.uri:
        url: >-
          https://{{ remnawave_sub_public_domain }}/{{ remnawave_subscription_prod_healthcheck_short_uuid }}
        method: GET
        headers:
          Accept: text/html
          User-Agent: "{{ remnawave_subscription_prod_rollback_healthcheck_user_agent }}"
        status_code: 200
        return_content: false
        validate_certs: true
        use_proxy: false
        force: true
        timeout: 15
      delegate_to: localhost
      become: false
      register: _sub_rollback_rescue_probe
      failed_when: false
      changed_when: false
      when: remnawave_subscription_prod_healthcheck_short_uuid | trim | length > 0
      no_log: true

    - name: Fail after automatic production subscription rollback recovery
      ansible.builtin.fail:
        msg: >-
          Explicit production subscription rollback failed and the pre-rollback
          vhost was restored from timestamp backup.
          Transport probe status after rescue:
          {{ _sub_rollback_rescue_probe.status | default('skipped') }}.
