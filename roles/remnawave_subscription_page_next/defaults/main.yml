---
# Параллельный тестовый контур Remnawave Subscription Page 7.2.1
remnawave_sub_next_root_dir: /opt/remnasub-next
remnawave_sub_next_image: remnawave/subscription-page:7.2.1
remnawave_sub_next_service_name: remnawave-subscription-page-next
remnawave_sub_next_container_name: remnawave-subscription-page-next
remnawave_sub_next_bind_address: 127.0.0.1
remnawave_sub_next_external_port: 3011
remnawave_sub_next_internal_port: 3010
remnawave_sub_next_restart_policy: unless-stopped

remnawave_sub_next_panel_url: >-
  https://{{ remnawave_panel_frontend_domain | default('panel.example.com') }}
remnawave_sub_next_custom_sub_prefix: ""
remnawave_sub_next_marzban_legacy_enabled: true

remnawave_sub_next_caddy_auth_api_token: ""
remnawave_sub_next_cloudflare_client_id: ""
remnawave_sub_next_cloudflare_client_secret: ""

# Опционально: UUID конфигурации страницы в Remnawave (не попадает в .env, если пусто)
remnawave_sub_next_config_uuid: ""

# Опционально: shortUuid для HTTP health check (/:shortUuid); пусто — только TCP/container checks
remnawave_sub_next_healthcheck_short_uuid: ""
remnawave_sub_next_restart_stabilize_seconds: 5

# HTTPS reverse proxy (sub-next.vpn-for-friends.com -> 127.0.0.1:3011)
remnawave_sub_next_domain: ""
remnawave_sub_next_upstream_host: "127.0.0.1"
remnawave_sub_next_upstream_port: "{{ remnawave_sub_next_external_port }}"
remnawave_sub_next_nginx_enabled: false
remnawave_sub_next_nginx_site: subscription-next.conf
remnawave_sub_next_nginx_sites_dir: /etc/nginx/sites-available
remnawave_sub_next_nginx_sites_enabled_dir: /etc/nginx/sites-enabled
remnawave_sub_next_nginx_webroot: /var/www/letsencrypt
remnawave_sub_next_ssl_fullchain: >-
  /etc/letsencrypt/live/{{ remnawave_sub_next_domain }}/fullchain.pem
remnawave_sub_next_ssl_privkey: >-
  /etc/letsencrypt/live/{{ remnawave_sub_next_domain }}/privkey.pem
remnawave_sub_next_letsencrypt_email: >-
  admin@{{ cf_dns_zone | default(remnawave_sub_next_domain | regex_replace('^[^.]+\\.', '')) }}

# Dedicated public domain for existing runtime on 127.0.0.1:3011
# (sub.portalbase.link). Not an alias list — fixed single-domain vhost.
remnawave_sub_portalbase_domain: "sub.portalbase.link"
remnawave_sub_portalbase_upstream_host: "127.0.0.1"
remnawave_sub_portalbase_upstream_port: 3011
remnawave_sub_portalbase_nginx_enabled: false
remnawave_sub_portalbase_nginx_site: subscription-portalbase.conf
remnawave_sub_portalbase_nginx_sites_dir: /etc/nginx/sites-available
remnawave_sub_portalbase_nginx_sites_enabled_dir: /etc/nginx/sites-enabled
remnawave_sub_portalbase_nginx_webroot: /var/www/letsencrypt
remnawave_sub_portalbase_ssl_fullchain: >-
  /etc/letsencrypt/live/{{ remnawave_sub_portalbase_domain }}/fullchain.pem
remnawave_sub_portalbase_ssl_privkey: >-
  /etc/letsencrypt/live/{{ remnawave_sub_portalbase_domain }}/privkey.pem
remnawave_sub_portalbase_letsencrypt_email: "admin@portalbase.link"
remnawave_sub_portalbase_healthcheck_short_uuid: "VZLHkrKwsj0Qs82e"

# Секреты — задавать через Ansible Vault или inventory secrets
remnawave_sub_next_api_token: ""
remnawave_sub_next_marzban_legacy_secret_key: ""
